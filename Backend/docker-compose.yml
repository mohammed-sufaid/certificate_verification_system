version: '3.8'

services:
  db:
    # We use Azure SQL Edge because it offers native ARM64 support (perfect for Mac M1/M2/M3/M4 chips) 
    # while maintaining compatibility with SQL Server EF Core providers.
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: certificate-sql-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=VeryStrong!Password123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
      - ../Database:/usr/src/app/scripts

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certificate-api
    ports:
      - "5002:8080"
      - "5003:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=CertificateVerificationDB;User Id=sa;Password=VeryStrong!Password123;TrustServerCertificate=True;
      - Jwt__Key=VeryStrongSecretKey12345678901234567890
      - Jwt__Issuer=CertificateAPI
      - Jwt__Audience=CertificateClient
    depends_on:
      - db

volumes:
  sql_data:
